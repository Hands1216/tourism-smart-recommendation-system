version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: tourism-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tourism_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    networks:
      - tourism-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tourism-network

  # 后端服务
  backend:
    build:
      context: ./tourism-backend/tourism-main
      dockerfile: Dockerfile
    container_name: tourism-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tourism_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - tourism-network

  # 前端服务
  frontend:
    build:
      context: ./tourism-frontend
      dockerfile: Dockerfile
    container_name: tourism-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tourism-network

volumes:
  mysql-data:
  redis-data:

networks:
  tourism-network:
    driver: bridge
