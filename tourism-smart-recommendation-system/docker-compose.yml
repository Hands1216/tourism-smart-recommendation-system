services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: tourism-mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: tourism_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 实际脚本文件名为 database.sql，重命名挂载即可被 mysql 容器自动执行
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tourism-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tourism-network

  # 后端服务
  backend:
    image: tourism-backend:1.0.0
    build:
      context: ./tourism-backend/tourism-main
      dockerfile: Dockerfile
    container_name: tourism-backend
    restart: always
    ports:
      - "8080:8080"
    # 敏感配置通过同目录下 .env 文件注入（参考 .env.example）
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 数据库（容器网络内用 service name 作为主机名）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tourism_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 容器内上传目录，与 application-prod.yml 中 upload.path 对应
      UPLOAD_PATH: /app/uploads/
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # LLM
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      # 阿里云短信
      ALIYUN_SMS_ENABLED: ${ALIYUN_SMS_ENABLED:-false}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      # 微信
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # 高德地图
      AMAP_ENABLED: ${AMAP_ENABLED:-true}
      AMAP_KEY: ${AMAP_KEY:-}
      # 和风天气
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      WEATHER_AUTH_TYPE: ${WEATHER_AUTH_TYPE:-jwt}
      WEATHER_KEY: ${WEATHER_KEY:-}
      WEATHER_PROJECT_ID: ${WEATHER_PROJECT_ID:-}
      WEATHER_KEY_ID: ${WEATHER_KEY_ID:-}
      # 私钥（PEM 多行）保留在 application.yml 中，不通过环境变量传
    volumes:
      # 持久化上传图片，避免容器重建后图片丢失
      - tourism-uploads:/app/uploads
      - tourism-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tourism-network

  # 前端服务
  frontend:
    image: tourism-frontend:1.0.0
    build:
      context: ./tourism-frontend
      dockerfile: Dockerfile
    container_name: tourism-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - tourism-network

volumes:
  mysql-data:
  redis-data:
  tourism-uploads:
  tourism-logs:

networks:
  tourism-network:
    driver: bridge
