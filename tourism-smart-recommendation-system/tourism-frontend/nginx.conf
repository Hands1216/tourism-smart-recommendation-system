server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端容器
    # 后端 server.servlet.context-path=/api，已包含 /api 前缀，所以这里直接转发
    # ^~ 让此 location 优先于下方的正则静态资源 location，避免 /api/uploads/xxx.jpg 被抢走
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 上传文件访问：与 vite.config.ts 行为一致，把 /uploads/xxx 重写为 /api/uploads/xxx
    # ^~ 让此 location 优先于下方的正则静态资源 location，避免 .webp/.jpg 等扩展名被抢走
    location ^~ /uploads/ {
        rewrite ^/uploads/(.*)$ /api/uploads/$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 单页应用 history 模式 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
